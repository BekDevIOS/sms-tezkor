name: novasms-backend-dev

services:
  mongo:
    image: mongo:7.0
    restart: "no"
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: novasms-backend-dev:local
    restart: "no"
    init: true
    command: ["npm", "run", "start:dev"]
    environment:
      NODE_ENV: development
      PORT: 4009
      MONGO_DEV: mongodb://mongo:27017/novasms_dev
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:4010:4009"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4009/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: novasms-backend-dev:local
    restart: "no"
    init: true
    command: ["npm", "run", "start:dev:worker"]
    environment:
      NODE_ENV: development
      MONGO_DEV: mongodb://mongo:27017/novasms_dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 10s

volumes:
  mongo_data:
  node_modules:
